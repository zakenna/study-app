<!doctype html>
<html lang="ko" data-season="spring">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap"
    />
    <script>
      // 저장된 계절 테마를 화면이 그려지기 전에 적용 (없으면 봄)
      try {
        var s = JSON.parse(localStorage.getItem("studyapp:season"));
        if (["spring", "summer", "autumn", "winter"].indexOf(s) >= 0)
          document.documentElement.setAttribute("data-season", s);
      } catch (e) {}
    </script>
    <title>studyApp — 한국사 꿀팁 학습</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
